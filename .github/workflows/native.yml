name: Native builds
on:
  push:
    paths:
      [
        'platforms/**',
        'scripts/publish-native-screenshots.sh',
        'scripts/validate-ios-capture.swift',
        '.github/workflows/native.yml',
      ]
  pull_request:
    paths:
      [
        'platforms/**',
        'scripts/publish-native-screenshots.sh',
        'scripts/validate-ios-capture.swift',
        '.github/workflows/native.yml',
      ]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    # The screens this job renders are documentation assets, published at the end.
    # A pull request from a fork gets a read-only token and skips that step.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: ${{ !inputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?The runner must provide its Android SDK}"
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Prepare Android release signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/wave-release.keystore.p12"
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "WAVE_ANDROID_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "WAVE_ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "WAVE_ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-wave}" >> "$GITHUB_ENV"
            echo "WAVE_ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "Android APK signing: repository release keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            if [[ -n "${RELEASE_TAG:-}" ]]; then
              echo "::error::A persistent Android release keystore is required to publish an update-compatible APK."
              exit 1
            fi
            EPHEMERAL_PASS="$(openssl rand -hex 24)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias wave \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS" \
              -dname "CN=Wave, O=Jaime Gaming, L=Valladolid, C=ES"
            echo "WAVE_ANDROID_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "WAVE_ANDROID_KEYSTORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "WAVE_ANDROID_KEY_ALIAS=wave" >> "$GITHUB_ENV"
            echo "WAVE_ANDROID_KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "Android APK signing: generated PKCS12 release signing key (configure ANDROID_KEYSTORE_BASE64 secret for a persistent upload key)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test, lint and assemble signed Android APK
        shell: bash
        run: |
          set -o pipefail
          # -Dwave.screenshots also renders the documentation screenshots, from the app itself.
          gradle -p platforms/android testDebugUnitTest lintDebug assembleRelease -Dwave.screenshots=app/build/wave-screenshots --console=plain --stacktrace 2>&1 | tee android-build.log
      - name: Report the failing Android tests
        if: failure()
        shell: bash
        # A failing Compose render explains itself in its own exception; the task
        # name alone is useless. Each line of it becomes an annotation.
        run: node scripts/android-test-failures.mjs
      - name: Report Android diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f android-build.log ]]; then
            tail -n 100 android-build.log >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E '^e: |^Error: |^/.*: Error: |[Ff][Aa][Ii][Ll][Ee][Dd]|expected:' android-build.log || true)
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wave-android-diagnostics
          path: |
            android-build.log
            platforms/android/app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-android-screenshots
          path: platforms/android/app/build/wave-screenshots/*.png
          if-no-files-found: ignore
      - name: Publish the phone screenshots
        if: github.event_name == 'push' && success()
        shell: bash
        run: bash scripts/publish-native-screenshots.sh platforms/android/app/build/wave-screenshots '' platforms/android
      - name: Package and verify signed single-file Wave.apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          cp platforms/android/app/build/outputs/apk/release/app-release.apk artifacts/android/Wave.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/android/Wave.apk
          {
            echo "### Android package"
            echo "- File: \`Wave.apk\` (signed single-file APK)"
            echo "- SHA-256: \`$(sha256sum artifacts/android/Wave.apk | awk '{print $1}')\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wave-android-apk
          path: artifacts/android/Wave.apk
      - name: Attach signed Wave.apk to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" artifacts/android/Wave.apk --clobber

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: ${{ !inputs.tag }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run the Windows contract runner
        shell: pwsh
        run: |
          dotnet run --project platforms/windows/Wave.Contracts.Tests -c Release 2>&1 | Tee-Object -FilePath contracts.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content contracts.log | Select-String -Pattern 'Unhandled exception|^PASS ' -Context 0,2 |
              ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }
      - run: dotnet build platforms/windows/Wave.Windows/Wave.Windows.csproj -c Release
      - name: Exercise native Windows interface
        shell: pwsh
        run: |
          New-Item artifacts/windows-ui -ItemType Directory -Force | Out-Null
          $output = (Resolve-Path artifacts/windows-ui).Path
          $process = Start-Process platforms/windows/Wave.Windows/bin/Release/net10.0-windows/Wave.exe -ArgumentList @('--smoke-test', $output) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content artifacts/windows-ui/error.txt -ErrorAction SilentlyContinue
            $details = (Get-Content artifacts/windows-ui/error.txt -ErrorAction SilentlyContinue | Select-Object -First 8) -join ' | '
            Write-Output "::error title=Windows smoke failure::$details"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-windows-ui-smoke
          path: artifacts/windows-ui/
      - name: Publish the Windows screenshots
        if: github.event_name == 'push' && success()
        shell: bash
        run: bash scripts/publish-native-screenshots.sh artifacts/windows-ui windows- platforms/windows
      - name: Publish clean single-file Wave.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish platforms/windows/Wave.Windows/Wave.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=none -p:DebugSymbols=false -o artifacts/windows-raw
          New-Item artifacts/windows -ItemType Directory -Force | Out-Null
          Copy-Item artifacts/windows-raw/Wave.exe artifacts/windows/Wave.exe
          # Confirm the release folder exposes only the single Wave.exe binary and zero technical sidecars.
          $files = @(Get-ChildItem artifacts/windows -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Wave.exe') {
            throw "Expected a single Wave.exe deliverable; found: $($files.Name -join ', ')"
          }
      - name: Sign single-file Wave.exe
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path artifacts/windows/Wave.exe).Path
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'wave-codesign.pfx'
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
            $password = ConvertTo-SecureString -String $env:WINDOWS_SIGNING_CERT_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $timestamp = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) { 'https://timestamp.digicert.com' } else { $env:WINDOWS_TIMESTAMP_URL }
            & platforms/windows/scripts/Sign-Release.ps1 -ExecutablePath $exe -CertificateThumbprint $cert.Thumbprint -TimestampServer $timestamp
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            "Windows signing: Authenticode SHA-256 with trusted repository certificate." | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
              throw 'A trusted Windows signing certificate is required for release publication.'
            }
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Wave, O=Jaime Gaming" -KeyAlgorithm RSA -KeyLength 4096 -HashAlgorithm SHA256 -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(3)
            $sig = Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -HashAlgorithm SHA256
            if ($null -eq $sig.SignerCertificate -or $sig.Status -eq 'HashMismatch') {
              throw "Wave.exe Authenticode signing failed: $($sig.Status)"
            }
            "Windows signing: Authenticode SHA-256 signed (configure WINDOWS_SIGNING_CERT_BASE64 and WINDOWS_SIGNING_CERT_PASSWORD secrets for publicly trusted SmartScreen signing)." | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "### Windows package`n- File: ``Wave.exe`` (signed single-file executable)`n- SHA-256: ``$hash``" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Scan signed Wave.exe when Defender is available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = @{ scanned = $false; reason = 'Defender unavailable on this runner' }
          if (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue) {
            $status = Get-MpComputerStatus
            if ($status.AMServiceEnabled -and $status.AntivirusEnabled) {
              $scanPath = (Resolve-Path artifacts/windows/Wave.exe).Path
              Start-MpScan -ScanType CustomScan -ScanPath $scanPath
              $threats = @(Get-MpThreatDetection | Where-Object { ($_.Resources -join ' ') -like "*$scanPath*" })
              if ($threats.Count -gt 0) { throw 'Defender reported a detection in Wave.exe. Review it before publishing.' }
              $result = @{ scanned = $true; engine = $status.AMEngineVersion; definitions = $status.AntivirusSignatureVersion; reason = 'No detections reported' }
            }
          }
          if (-not $result.scanned) { Write-Output '::warning::Wave.exe was not scanned: Defender is unavailable or inactive.' }
          $result | ConvertTo-Json | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: wave-windows-exe
          path: artifacts/windows/Wave.exe
      - name: Attach signed Wave.exe to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" artifacts/windows/Wave.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ios-captures:
    runs-on: macos-26
    # Like Windows and Android, these are photographs of the running native
    # client on a seeded library. The job publishes only PNGs to the branch;
    # no signed device build or distribution package is produced.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: ${{ !inputs.tag }}
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE=$(python3 -c 'from pathlib import Path; import re; apps=[p for p in Path("/Applications").glob("Xcode_26*.app") if (p/"Contents/Developer").is_dir()]; key=lambda p: tuple(map(int, re.search(r"Xcode_([\d.]+)\.app", p.name).group(1).split("."))) if re.search(r"Xcode_([\d.]+)\.app", p.name) else (0,); print(max(apps, key=key)/"Contents/Developer" if apps else "", end="")')
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Capture the SwiftUI app on a simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin).get("devices",{}); found=[device for runtime,devices in d.items() if "iOS" in runtime for device in devices if device.get("isAvailable") and "iPhone" in device.get("name","")]; print(found[0]["udid"] if found else "", end="")')
          if [[ -z "$DEVICE" ]]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=json.load(sys.stdin).get("runtimes",[]); ios=[x for x in r if x.get("isAvailable") and (x.get("platform")=="iOS" or "iOS" in x.get("identifier",""))]; print(ios[0]["identifier"] if ios else "", end="")')
            TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin).get("devicetypes",[]); phones=[x for x in d if "iPhone" in x.get("name","")]; best=next((x for x in phones if "iPhone 16 Pro" in x.get("name","")), phones[0] if phones else None); print(best["identifier"] if best else "", end="")')
            test -n "$RUNTIME" && test -n "$TYPE"
            DEVICE=$(xcrun simctl create 'Wave Capture' "$TYPE" "$RUNTIME")
          fi
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          DERIVED="$RUNNER_TEMP/WaveCaptureDerivedData"
          xcodebuild \
            -project platforms/ios/Wave.xcodeproj \
            -scheme Wave \
            -destination "platform=iOS Simulator,id=$DEVICE,arch=arm64" \
            -derivedDataPath "$DERIVED" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
          APP=$(find "$DERIVED/Build/Products" -maxdepth 3 -type d -name Wave.app -print -quit)
          test -n "$APP" && test -f "$APP/Info.plist"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test -n "$BUNDLE"
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p artifacts/ios-ui
          swiftc scripts/validate-ios-capture.swift -o "$RUNNER_TEMP/validate-ios-capture"
          for page in home library search remix settings now-playing; do
            # Launch with an isolated in-memory fixture. Opening a URL can show
            # an iOS confirmation dialog instead of navigating the app.
            xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
            SIMCTL_CHILD_WAVE_CAPTURE_PAGE="$page" xcrun simctl launch "$DEVICE" "$BUNDLE"
            # A successful simctl screenshot can still be the white launch screen.
            # Retry briefly and fail rather than publishing an obviously blank page.
            shot="artifacts/ios-ui/$page.png"
            for attempt in {1..8}; do
              sleep 5
              rm -f "$shot"
              xcrun simctl io "$DEVICE" screenshot "$shot"
              if "$RUNNER_TEMP/validate-ios-capture" "$shot"; then break; fi
              echo "Waiting for $page to render (attempt $attempt)"
            done
            "$RUNNER_TEMP/validate-ios-capture" "$shot"
          done
          for shot in artifacts/ios-ui/*.png; do
            test -s "$shot"
            sips -g pixelWidth -g pixelHeight "$shot" > /dev/null
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-ios-ui
          path: artifacts/ios-ui/
      - name: Publish the iOS screenshots
        if: github.event_name == 'push' && success()
        shell: bash
        run: bash scripts/publish-native-screenshots.sh artifacts/ios-ui ios- platforms/ios
