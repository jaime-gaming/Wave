name: Documentation images

# The README and the docs pages show the running app. Those images go stale as
# the interface changes, so this workflow photographs the current one without
# anyone needing a browser on their laptop: it starts the built site, runs the
# capture script against it, and commits the PNGs, the same way the native jobs
# publish their own screenshots. The images are therefore always of the code that
# made them, and a review can look at a real render instead of a description.
on:
  workflow_dispatch:
    inputs:
      review:
        description: 'Also photograph the mobile, player and narrow layouts'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the build
        run: |
          npx vite preview --host 127.0.0.1 --port 5173 --strictPort &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:5173/ > /dev/null && exit 0
            sleep 1
          done
          echo "The preview server never answered." && exit 1
      - run: npm run capture:docs
        env:
          WAVE_URL: http://127.0.0.1:5173
          WAVE_REVIEW: ${{ inputs.review }}
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-images
          path: docs/media/*.png
          retention-days: 14
      - name: Publish the images to the branch
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          shots=(docs/media/*.png)
          if [[ ${#shots[@]} -eq 0 ]]; then
            echo "Nothing was captured; nothing to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media
          if git diff --cached --quiet; then
            echo "Images unchanged."
            exit 0
          fi
          git commit -m 'Refresh the web screenshots from the built app'
          # The native jobs publish to the same branch and may land first.
          for attempt in 1 2 3 4; do
            # The native jobs publish to this same branch, so the first push can
            # lose the race. Rebase onto whatever landed, and leave nothing
            # uncommitted behind that would refuse the rebase.
            git checkout -- . || true
            if git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push --quiet; then exit 0; fi
            git rebase --abort || true
          done
          echo "Could not publish the images." && exit 1
