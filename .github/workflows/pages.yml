name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:release && npm run release:check
      - run: npm run lint && npm test
      - run: npm run build
        env:
          WAVE_BASE_PATH: /Wave/
      - run: touch dist/.nojekyll
      - name: Explain optional deployment
        if: vars.PAGES_ENABLED != 'true'
        run: |
          echo "::notice::Pages build only. Enable GitHub Pages and set repository variable PAGES_ENABLED=true to deploy."
          echo 'Pages deployment is disabled. The web build is available as a workflow artifact; repository visibility is unchanged.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
