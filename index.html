<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#12131a" />
    <meta
      name="description"
      content="Play and organize your music with Wave: a local music player with lyrics, playlists, smooth mixes and apps for Android and Windows."
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="application-name" content="Wave" />
    <meta name="format-detection" content="telephone=no" />

      Loaded before the bundle and never bundled with it: if a stale service
      worker serves an old document, this watchdog repairs the shell by itself.
    -->
    <script defer src="%BASE_URL%boot.js"></script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%wave.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="canonical" href="https://wave.jaime-gaming.com/" />
    <meta property="og:site_name" content="Wave" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wave, a local music player" />
    <meta property="og:url" content="https://wave.jaime-gaming.com/" />
    <meta
      property="og:description"
      content="Play and organize your music with Wave: a local music player with lyrics, playlists, smooth mixes and apps for Android and Windows."
    />
    <meta property="og:image" content="https://wave.jaime-gaming.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Wave, a local music player" />
    <meta
      name="twitter:description"
      content="Play and organize your music with Wave, a local music player for web, Android and Windows."
    />
    <meta name="twitter:image" content="https://wave.jaime-gaming.com/icons/icon-512.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Wave",
        "url": "https://wave.jaime-gaming.com/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web, Android, Windows",
        "description": "A local music player with playlists, lyrics and smooth transitions.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <title>Wave, a local music player</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
